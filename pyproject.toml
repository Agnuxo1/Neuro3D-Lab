[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optlab"
version = "0.1.0"
description = "Optical lab: scalar-field propagation, Fresnel, MZI and diffractive neural networks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:nengo --basetemp=.pytest_tmp"
pythonpath = ["src"]
