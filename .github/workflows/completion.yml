name: completion protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,experiments,figures]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python scripts/smoke_run.py --output '${{ runner.temp }}/completion-smoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-evidence-python-${{ matrix.python }}
          path: ${{ runner.temp }}/completion-smoke
