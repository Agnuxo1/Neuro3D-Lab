# Unit tests for the optlab core.
#
# Blender is NOT run in CI. The add-on self-test (blender/selftest/run_selftest.py)
# needs a local Blender 4.5 binary and is run manually; see CONTRIBUTING.md.
name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install optlab with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
